<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grow a Garden 2 Hub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- Header -->
    <header class="header">
      <a href="index.html" class="logo" aria-label="Grow a Garden 2 Hub home">
        <span class="logo-circle"></span>
      </a>

      <nav class="nav-pill" aria-label="Main navigation">
        <a href="#" class="nav-link active">Home</a>
        <a href="#" class="nav-link">Reviews</a>
        <a href="#" class="nav-link">Trades</a>
        <a href="#" class="nav-link">Giveaways</a>
        <a href="#" class="nav-link">Calculator</a>
      </nav>

      <a href="signup.html" class="create-account">
        <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        Create Account
      </a>
    </header>

    <!-- Hero -->
    <main class="hero-container">
      <div class="hero-inner">
        <!-- Video Background -->
        <video
          class="hero-video"
          autoplay
          loop
          muted
          playsinline
          aria-hidden="true"
        >
          <source src="images-videos/landingpage/landingpage.mp4" type="video/mp4">
        </video>

        <div class="hero-overlay"></div>

        <!-- Hero Content -->
        <div class="hero-content">
          <span class="hero-badge">Official Community Hub</span>
          <h1 class="hero-title">#1 Grow a Garden 2 Hub</h1>
          <p class="hero-subtitle">Verified and Sponsored by the YouTuber, KreekKraft.</p>
          <a href="signup.html" class="btn-join">Join Now!</a>
        </div>

        <!-- Bottom-right progress bar -->
        <div class="progress-widget">
          <span class="progress-label">Garden Progress</span>
          <div class="progress-track">
            <div class="progress-fill"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Partner Bar -->
    <footer class="partner-bar">
      <div class="partner-list">
        <div class="partner-item">
          <img src="images/placeholder.svg" alt="" class="partner-icon" width="20" height="20">
          <span>KreekKraft</span>
        </div>
        <div class="partner-item">
          <img src="images/placeholder.svg" alt="" class="partner-icon" width="20" height="20">
          <span>BachaBlox</span>
        </div>
        <div class="partner-item">
          <img src="images/placeholder.svg" alt="" class="partner-icon" width="20" height="20">
          <span>Steak</span>
        </div>
        <div class="partner-item">
          <img src="images/placeholder.svg" alt="" class="partner-icon" width="20" height="20">
          <span>Caylus</span>
        </div>
        <div class="partner-item">
          <img src="images/placeholder.svg" alt="" class="partner-icon" width="20" height="20">
          <span>kcasllab</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
